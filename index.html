<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda del día</title>
<meta name="theme-color" content="#e0457b">
<meta name="description" content="Agenda del día: gestión de citas, pacientes y consultorios.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Agenda del día">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
color-scheme:light;--bg:#fff;--surface:#fff;--ink:#2b2230;--muted:#7d6c7a;--line:#f6dce7;--accent:#e0457b;--accent-ink:#fff;--warn:#b3261e;--warn-bg:#fff0ee}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;line-height:1.45}
main{max-width:720px;margin:0 auto;padding:20px 16px 130px}
h1{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-size:2rem;margin:0;letter-spacing:-.02em;display:inline-block;border-bottom:3px solid var(--accent);padding-bottom:2px}
.sub{color:var(--muted);margin:2px 0 18px;text-transform:capitalize}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.bar input[type=date]{width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{border-radius:999px;padding:5px 12px;font-size:.9rem;display:flex;align-items:center;gap:6px}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip[aria-pressed=true]{background:#fde7ef;color:var(--accent);border-color:var(--accent);font-weight:600}
.count{color:var(--muted);margin:0 0 10px}
.appt{display:grid;grid-template-columns:64px 1fr auto;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:12px;margin-bottom:10px}
.appt.done{opacity:.55}.appt.done .pt{text-decoration:line-through}
.time{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:700;font-size:1.25rem;line-height:1.1}
.time small{display:block;font-family:Figtree,sans-serif;font-weight:400;font-size:.78rem;color:var(--muted)}
.pt{font-weight:600}.meta{color:var(--muted);font-size:.9rem}
.tag{display:inline-block;font-size:.8rem;padding:1px 8px;border-radius:999px;border:1px solid var(--c);margin-top:4px}
.clash{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:4px 8px;font-size:.85rem;margin-top:6px}
.acts{display:flex;flex-direction:column;gap:6px}
.acts button{padding:5px 9px;font-size:.85rem}
.empty{text-align:center;color:var(--muted);padding:34px 10px;border:2px dashed var(--line);border-radius:14px}
form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:18px;display:none}
form.open{display:block}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:.85rem;color:var(--muted)}
.full{grid-column:1/-1}
[hidden]{display:none!important}
.sug{position:absolute;left:0;right:0;top:100%;margin-top:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 20px rgba(224,69,123,.2);z-index:50;max-height:210px;overflow:auto}
.sug button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:0;padding:10px 12px;color:var(--ink)}
.sug button:hover{background:#fde7ef}
.sug small{color:var(--muted);margin-left:8px}
#form,#apForm{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;margin:0;z-index:40;box-shadow:0 20px 50px rgba(224,69,123,.3)}
#backdrop,#apBackdrop{display:none}
#form.open+#backdrop,#apForm.open+#apBackdrop{display:block;position:fixed;inset:0;background:rgba(43,34,48,.45);z-index:35}
.appt{touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .18s,background .18s;--ok:#1f9d63;--bad:#d63a32}
.appt.ok,.appt[data-sw=ok]{background:#e9f8f0;border-color:var(--ok);border-left-color:var(--c)}
.appt.no,.appt[data-sw=no]{background:#fdeceb;border-color:var(--bad);border-left-color:var(--c)}
.acts button[data-stv=ok][aria-pressed=true]{background:var(--ok);color:#fff;border-color:var(--ok)}
.acts button[data-stv=no][aria-pressed=true]{background:var(--bad);color:#fff;border-color:var(--bad)}
.badge.ok{background:#dff3e8;color:#17724a}
.cal{position:absolute;left:0;top:46px;width:292px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 10px 30px rgba(224,69,123,.2);z-index:30}
.calh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.calh b{text-transform:capitalize}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.calg span{font-size:.75rem;color:var(--muted);padding:4px 0}
.calg button{border:0;background:none;border-radius:50%;aspect-ratio:1;padding:0;font-size:.9rem;position:relative}
.calg button:hover{background:#fde7ef}
.calg button.hoy{border:1px solid var(--accent)}
.calg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.calg button.has::after{content:"";position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.calg button.on.has::after{background:var(--accent-ink)}
.calm{display:flex;gap:8px;align-items:center;margin:10px 0 8px;font-size:.9rem;color:var(--ink)}
.calf{display:flex;gap:6px;justify-content:flex-end}
@media(max-width:480px){.cal{position:fixed;left:50%;transform:translateX(-50%);top:110px}}
.head{display:flex;justify-content:center;margin-bottom:6px}
.head .logo{display:block;height:58px;width:auto;max-width:100%}
.titlebar{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;text-align:left;margin:4px 0 16px}
.titlebar h1{line-height:1.2}.titlebar .sub{margin:4px 0 0}
.menuwrap{position:relative;justify-self:end}
@media(max-width:480px){.head .logo{height:44px}.titlebar h1{font-size:1.5rem}}
.menu{position:absolute;right:0;top:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:220px;box-shadow:0 8px 24px rgba(224,69,123,.18);display:none;z-index:20}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px}
.menu button:hover,.menu button[aria-current=true]{background:#fde7ef;color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;flex-wrap:wrap}
.tot{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.tot div{flex:1;min-width:130px;background:#fde7ef;border-radius:12px;padding:10px 12px;font-size:.85rem;color:var(--muted)}
.tot b{display:block;font-family:"Bricolage Grotesque",Figtree,sans-serif;font-size:1.3rem;color:var(--accent)}
h2{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-size:1.2rem;margin:22px 0 8px}
.badge{font-size:.8rem;border-radius:999px;padding:1px 9px;background:#fde7ef;color:var(--accent)}.badge.pend{background:var(--warn-bg);color:var(--warn)}
@media(max-width:480px){.g{grid-template-columns:1fr}.appt{grid-template-columns:54px 1fr}.acts{grid-column:1/-1;flex-direction:row}}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.th{width:84px;height:84px;padding:0;border-radius:10px;overflow:hidden;position:relative;border:1px solid var(--line);background:#000;cursor:pointer}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th small{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:.68rem;padding:1px 0;text-align:center}
.th.add{display:flex;align-items:center;justify-content:center;background:#fde7ef;color:var(--accent);font-size:1.6rem;border:1px dashed var(--accent)}
.lb{position:fixed;inset:0;background:rgba(20,12,24,.92);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.lb img{max-width:100%;max-height:76dvh;object-fit:contain;border-radius:8px}
.lbb{display:flex;gap:8px;align-items:center;color:#fff}
.acts{flex-wrap:wrap}.acts .pay{background:#fde7ef;color:var(--accent);border-color:var(--accent)}
.fab{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;width:76px;height:76px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;background:var(--accent);color:#fde7ef;border:0;box-shadow:0 10px 24px rgba(224,69,123,.4)}
.fab:active{transform:translateX(-50%) scale(.96)}
#v-agenda>.bar{flex-wrap:nowrap}
#v-agenda>.bar input[type=date]{flex:1 1 auto;min-width:0}
.fil{width:42px;height:42px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.fil.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fpop{position:absolute;right:0;top:50px;width:230px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 10px 30px rgba(224,69,123,.2);z-index:30}
.fpop .fh{display:block;padding:6px 8px;font-size:.85rem;color:var(--muted)}
#fList,#pfList{max-height:50dvh;overflow:auto}
.fpop button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 8px;border-radius:8px}
.fpop button:hover,.fpop button[aria-pressed=true]{background:#fde7ef}
.fpop button[aria-pressed=true]{font-weight:600;color:var(--accent)}
.fpop i{width:12px;height:12px;border-radius:50%;flex:none}
@media(max-width:480px){.fpop{position:fixed;right:auto;left:50%;transform:translateX(-50%);top:150px}}
.appt .acts{flex-direction:row;grid-column:1/-1;justify-content:flex-end;gap:6px}
.appt .acts button{min-width:38px;height:38px;padding:0 8px;display:flex;align-items:center;justify-content:center;font-size:1rem;line-height:1}
.appt .acts button[data-del]:hover,.appt .acts button.armed{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.fab-s{flex:none;width:44px;height:44px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;background:var(--accent);color:#fde7ef;border:0;box-shadow:0 4px 10px rgba(224,69,123,.3)}
#pfpop{max-height:70dvh;overflow:auto}
#pfpop .pfok{justify-content:center;font-weight:600;color:var(--accent)}
#pfpop .pfclr{justify-content:center;color:var(--muted)}
@media(max-width:480px){#pfpop{top:230px;max-height:calc(100dvh - 250px)}}
.prow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.prow:hover{background:#fff7fa}
.wback{position:fixed;inset:0;background:rgba(43,34,48,.45);z-index:44}
.win{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;z-index:45;box-shadow:0 20px 50px rgba(224,69,123,.3)}
.wh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.wh h2{margin:0;font-size:1.25rem}
.wacts{display:flex;gap:6px}
.ic{width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%}
#profEdit{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{border:0;background:none;border-radius:8px 8px 0 0;padding:9px 12px;color:var(--muted);flex:1;border-bottom:3px solid transparent}
.tabs button[aria-selected=true]{color:var(--accent);font-weight:600;border-bottom-color:var(--accent)}
.tabs button:disabled{opacity:.4}
.dl{margin:0}.dl dt{font-size:.8rem;color:var(--muted);margin-top:10px}.dl dd{margin:0;white-space:pre-wrap;font-weight:500}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px;font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:700;font-size:1.1rem}
.acc summary::-webkit-details-marker{display:none}
.acc summary small{margin-left:auto;font-family:Figtree,sans-serif;font-weight:500;color:var(--muted);font-size:.85rem}
.acc summary::after{content:"";width:9px;height:9px;border-right:2.5px solid var(--accent);border-bottom:2.5px solid var(--accent);transform:rotate(45deg);transition:transform .18s;margin:-4px 4px 0 6px}
.acc[open] summary::after{transform:rotate(-135deg);margin-top:4px}
.acc[open] summary{border-bottom:1px solid var(--line);background:#fff7fa}
.acc summary:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.accb{padding:14px 16px}
#invTabs .chip{text-transform:uppercase;letter-spacing:.04em;font-weight:600;flex:1;justify-content:center;padding:9px 6px}
.stp{width:38px;height:38px;padding:0;font-size:1.25rem;line-height:1;display:flex;align-items:center;justify-content:center}
#pgfpop{max-height:70dvh;overflow:auto}
#pgfpop .pfok{justify-content:center;font-weight:600;color:var(--accent)}
#pgfpop .pfclr{justify-content:center;color:var(--muted)}
@media(max-width:480px){#pgfpop{top:110px;max-height:calc(100dvh - 130px)}}
.repw{position:fixed;inset:0;background:rgba(43,34,48,.55);z-index:70;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:12px}
.repbox{background:#fff;color:#222;width:min(860px,100%);border-radius:12px;padding:16px}
.reptool{display:flex;gap:8px;margin-bottom:12px}
.rep h1{font-size:1.3rem;border:0;margin:0}.rep .rh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.rep .rh img{height:44px;width:auto;max-width:55%}
.rep .rm{font-size:.82rem;color:#555;margin:2px 0}
.rep table{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:10px}
.rep th,.rep td{border-bottom:1px solid #ddd;padding:6px 4px;text-align:left;vertical-align:top}
.rep th{background:#fde7ef;color:#222}.rep .r{text-align:right;white-space:nowrap}
.rep .sum{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:.9rem}.rep .sum b{display:block;font-size:1.05rem}
@page{margin:12mm}
@media print{
 body>*:not(#repWrap){display:none!important}
 #repWrap{position:static!important;background:none!important;padding:0!important;display:block!important;overflow:visible!important}
 .repbox{box-shadow:none!important;border-radius:0!important;width:100%!important;padding:0!important}
 .reptool{display:none!important}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.fbar{display:flex;gap:8px;margin:0 0 12px}.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.fbar select,.fgrid select{flex:1;min-width:0;width:100%;-webkit-appearance:none;appearance:none;border-radius:999px;padding:10px 34px 10px 14px;font-weight:500;text-overflow:ellipsis;background:var(--surface) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23e0457b' stroke-width='2' stroke-linecap='round'/></svg>") no-repeat right 14px center}
.fbar select.on,.fgrid select.on{background-color:#fde7ef;border-color:var(--accent);color:var(--accent);font-weight:600}
.seg{display:flex;gap:4px;background:#fde7ef;border-radius:999px;padding:4px;margin-bottom:12px}
.seg button{flex:1;position:relative;border:0;background:transparent;border-radius:999px;padding:10px 4px;font-weight:700;font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 8px rgba(224,69,123,.3)}
.seg .dot{position:absolute;top:6px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--warn);border:2px solid #fde7ef}
.seg button[aria-pressed=true] .dot{border-color:var(--accent)}
.ihead{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px}
.pill{border-radius:999px;padding:6px 16px;font-size:.85rem;font-weight:600;color:var(--accent);border-color:var(--accent)}
.pill[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.iadd{display:flex;gap:8px;margin-bottom:12px}.iadd input{border-radius:999px;padding:11px 16px}
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:640px){.igrid{grid-template-columns:repeat(3,1fr)}}
.it{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;position:relative}
.it .nm{font-weight:600;line-height:1.25;min-height:2.5em;display:flex;align-items:center}
.it.out{background:var(--warn-bg);border-color:var(--warn)}.it.out .nm{padding-right:56px}.it.out .n{color:var(--warn)}
.oos{position:absolute;top:10px;right:10px;font-size:.66rem;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.04em}
.nmrow{display:flex;gap:6px;align-items:center}.nmi{padding:8px 10px;font-weight:600;min-width:0}
.ib{flex:none;width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%}
.ib.armed{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.q{display:flex;align-items:center;justify-content:space-between;gap:4px}

.qb.pri{background:var(--accent);color:var(--accent-ink)}
.it .n{width:100%;min-width:0;text-align:center;border:0;background:transparent;font-family:"Bricolage Grotesque",Figtree,sans-serif;font-size:1.8rem;font-weight:700;padding:0;-moz-appearance:textfield}

<script>
const COLORS=["#e0457b","#b0589f","#f08aa8","#8f5fd1","#d9718c","#c0407a"];
const KEY="agenda-odonto-v1";
let S={clinics:[{id:"c1",name:"Consultorio 1",color:COLORS[0]},{id:"c2",name:"Consultorio 2",color:COLORS[1]}],appts:[]};
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
let day=iso(new Date()),filter=null,mode="uno",sel=[];
const mins=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};
const hhmm=n=>String(Math.floor(n/60)%24).padStart(2,"0")+":"+String(n%60).padStart(2,"0");
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cl=id=>S.clinics.find(c=>c.id===id)||{name:"—",color:"#888"};

function render(){
 $("fecha").value=day;
 const d=new Date(day+"T12:00:00");
 $("fechaTxt").textContent=d.toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long"});
 $("consultorio").innerHTML=S.clinics.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("");
 $("chips").innerHTML=`<button class="chip" data-f="" aria-pressed="${!filter}">Todos</button>`+

const idb=()=>_db||(_db=new Promise((res,rej)=>{try{const r=indexedDB.open("agenda-rx",1);r.onupgradeneeded=()=>r.result.createObjectStore("rx",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}));
const tx=async(m,f)=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("rx",m);const q=f(t.objectStore("rx"));t.oncomplete=()=>res(q&&q.result);t.onerror=t.onabort=()=>rej(t.error)})};
function shrink(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);b?res(b):rej()},"image/jpeg",.82)};img.onerror=rej;img.src=u})}
async function loadRx(){rxUrls.forEach(u=>URL.revokeObjectURL(u));rxUrls=[];const boxes=document.querySelectorAll("#profBody .rx");if(!boxes.length)return;

 if(sw.on){sw.dx=Math.max(-140,Math.min(140,dx));sw.c.style.transition="none";sw.c.style.transform=`translateX(${sw.dx}px)`;sw.c.dataset.sw=sw.dx>40?"ok":sw.dx<-40?"no":""}});

 if(on&&a){const o=a.spec==="Ortodoncia"||/ortodoncia/i.test(a.treat||"");$("apNFecha").value=o?plusMonth(a.date):a.date;$("apNHora").value=a.time}}
$("apNueva").addEventListener("change",syncNext);
function toast(t){let e=$("toast");if(!e){e=document.createElement("div");e.id="toast";e.setAttribute("role","status");e.style.cssText="position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;z-index:80;font-size:.9rem;max-width:90vw;text-align:center";document.body.appendChild(e)}
 e.textContent=t;e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>{e.hidden=true},3500)}
$("apForm").onsubmit=e=>{e.preventDefault();const a=apA;if(!a)return;
 const base=+$("apMonto").value||0,exT=apEx.reduce((s,e)=>s+e.price*e.qty,0);if(base+exT<=0){toast("Escribe un monto o agrega un extra.");return}
 S.pays.push({id:uid("g"),patient:a.patient,treat:a.treat,amount:base+exT,base,extras:apEx.map(e=>({...e})),date:$("apFecha").value,method:$("apMet").value,paid:$("apEst").value==="1",aid:a.id,clinic:a.clinic,spec:a.spec||""});
 autoAttend(a.id);
 let nd=null;
 if($("apNueva").checked){nd={id:"a"+Date.now()+"n",done:false,date:$("apNFecha").value,time:$("apNHora").value,dur:a.dur||45,patient:a.patient,phone:a.phone||"",spec:a.spec||"General",price:0,treat:"",notes:"",clinic:a.clinic};S.appts.push(nd)}
 save();closePay();render();
 if(nd)toast("Nueva cita agendada: "+new Date(nd.date+"T12:00:00").toLocaleDateString("es-MX",{weekday:"short",day:"numeric",month:"short"})+" · "+nd.time)};

function armDel(b){if(b.dataset.armed)return true;b.dataset.armed=1;b.classList.add("armed");b.setAttribute("aria-label","Toca de nuevo para borrar");
 setTimeout(()=>{delete b.dataset.armed;b.classList.remove("armed");b.setAttribute("aria-label","Borrar cita")},3000);return false}

/* Pacientes: filtros (menús desplegables) */
let pClin=null;
function drawPF(){$("pSelC").innerHTML='<option value="">Todos los consultorios</option>'+S.clinics.map(c=>`<option value="${c.id}"${pClin===c.id?" selected":""}>${esc(c.name)}</option>`).join("");
 $("pSelS").innerHTML='<option value="">Todas las especialidades</option>'+SPECS.map(s=>`<option${pSpec===s?" selected":""}>${s}</option>`).join("");
 $("pSelC").classList.toggle("on",!!pClin);$("pSelS").classList.toggle("on",!!pSpec)}
$("pSelC").onchange=e=>{pClin=e.target.value||null;rPac()};
$("pSelS").onchange=e=>{pSpec=e.target.value;rPac()};

/* Administración: una sección abierta a la vez */
document.querySelectorAll("#v-adm details.acc").forEach(d=>d.addEventListener("toggle",()=>{if(d.open)document.querySelectorAll("#v-adm details.acc").forEach(o=>{if(o!==d)o.open=false})}));

/* Inventario */
S.inv=S.inv||[];
(function(){if(S.seededInv)return;
 const D={orto:["Elásticos Gorila","Elásticos Lobo","Elásticos Tortuga","Resina","Resina Fluida","Adhesivo","Ácido Grabador","Microbrush"],
  gen:["Papel articular","Resina","Adhesivo","Microbrush","Ácido grabador","Anestesia","Agujas","Topicana"],
  lim:["Papel","Fabuloso","Cloro","Bolsas negras"]};
 for(const c in D)D[c].forEach(n=>S.inv.push({id:uid("i"),cat:c,name:n,qty:0}));
 S.seededInv=1;save()})();
let iCat="orto",iEdit=false;
const ICATS=[["orto","Ortodoncia"],["gen","General"],["lim","Limpieza"]];
const TRASH='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/></svg>';
function rInv(){
 $("invTabs").innerHTML=ICATS.map(([k,l])=>{const o=S.inv.filter(x=>x.cat===k&&!(+x.qty>0)).length;return `<button data-c="${k}" aria-pressed="${k===iCat}">${l}${o?`<i class="dot" title="${o} agotados"></i>`:""}</button>`}).join("");
 const L=S.inv.filter(x=>x.cat===iCat),out=L.filter(x=>!(+x.qty>0)).length;
 $("iInfo").textContent=`${L.length} ${L.length===1?"artículo":"artículos"}${out?` · ${out} ${out===1?"agotado":"agotados"}`:""}`;
 $("iEditBtn").textContent=iEdit?"Listo":"Editar";$("iEditBtn").setAttribute("aria-pressed",String(iEdit));
 $("iLista").innerHTML=L.length?L.map(x=>{const q=+x.qty||0;return `<div class="it${q?"":" out"}">
  ${iEdit?`<div class="nmrow"><input class="nmi" data-in="${x.id}" value="${esc(x.name)}" aria-label="Nombre"><button class="ib" data-idel="${x.id}" aria-label="Borrar artículo" title="Borrar">${TRASH}</button></div>`:`<div class="nm">${esc(x.name)}</div>`}
  <div class="q"><button class="qb" data-im="${x.id}" aria-label="Quitar uno">\u2212</button><input class="n" data-iq="${x.id}" type="number" min="0" inputmode="numeric" value="${q}" aria-label="Cantidad de ${esc(x.name)}"><button class="qb" data-ip="${x.id}" aria-label="Agregar uno">+</button></div>
  ${q?"":`<span class="oos">Agotado</span>`}</div>`}).join(""):`<div class="empty" style="grid-column:1/-1">No hay artículos en esta categoría.<br>Agrega el primero arriba.</div>`}
function armIt(b){if(b.dataset.armed)return true;b.dataset.armed=1;b.classList.add("armed");setTimeout(()=>{delete b.dataset.armed;b.classList.remove("armed")},3000);return false}
$("invTabs").onclick=e=>{const b=e.target.closest("[data-c]");if(!b)return;iCat=b.dataset.c;rInv()};
$("iEditBtn").onclick=()=>{iEdit=!iEdit;rInv()};
$("iLista").onclick=e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset,it=id=>S.inv.find(x=>x.id===id);
 if(d.im){const x=it(d.im);x.qty=Math.max((+x.qty||0)-1,0)}
 else if(d.ip){const x=it(d.ip);x.qty=(+x.qty||0)+1}
 else if(d.idel){if(!armIt(b))return;S.inv=S.inv.filter(x=>x.id!==d.idel)}
 else return;save();rInv()};
$("iLista").onchange=e=>{const i=e.target,d=i.dataset;
 if(d.iq){const x=S.inv.find(y=>y.id===d.iq);if(x){x.qty=Math.max(Math.round(+i.value)||0,0);save();rInv()}}
 else if(d.in){const x=S.inv.find(y=>y.id===d.in);if(x){x.name=i.value.trim()||x.name;save();rInv()}}};
$("iAdd").onclick=()=>{const n=$("iNom").value.trim();if(!n)return;S.inv.push({id:uid("i"),cat:iCat,name:n,qty:0});$("iNom").value="";save();rInv()};
$("iNom").addEventListener("keydown",e=>{if(e.key==="Enter")$("iAdd").click()});

/* Reporte en PDF (descarga) */
let _pdfLib=null;
function loadPdf(){if(window.jspdf)return Promise.resolve();return _pdfLib||(_pdfLib=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";s.onload=res;s.onerror=()=>{_pdfLib=null;rej(new Error("lib"))};document.head.appendChild(s)}))}
async function makePdf(){
 try{await loadPdf()}catch(e){toast("No se pudo cargar el generador de PDF. Revisa tu conexión.");return}
 const L=pgList(),paid=L.filter(x=>x.paid),m=k=>sumA(paid.filter(x=>x.method===k)),hoy=iso(new Date());
 const per=pg.per==="hoy"?"Hoy, "+fdate(hoy):pg.per==="mes"?"Mes de "+new Date().toLocaleDateString("es-MX",{month:"long",year:"numeric"}):"Todos los pagos";
 const filt=[pg.est?(pg.est==="c"?"Cobrados":"Pendientes"):"",pg.clin?clinName(pg.clin):"",pg.spec].filter(Boolean).join(", ");
 const{jsPDF}=window.jspdf,doc=new jsPDF({unit:"mm",format:"a4"});
 const W=210,M=14,cols=[["Fecha",24],["Paciente",44],["Consultorio",32],["Detalle del pago",54],["Monto",28]];
 let y=14;
 const logo=document.querySelector(".head .logo");
 if(logo&&logo.naturalWidth){const w=48,hh=w*logo.naturalHeight/logo.naturalWidth;try{doc.addImage(logo.src,"PNG",M,y,w,hh)}catch(e){}}
 doc.setFont("helvetica","bold");doc.setFontSize(16);doc.setTextColor(34);doc.text("Reporte de pagos",W-M,y+6,{align:"right"});
 doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(90);doc.text("Odontóloga Narda Beas",W-M,y+11,{align:"right"});
 y+=22;
 doc.setFontSize(9.5);doc.setTextColor(40);
 doc.text("Periodo: "+per,M,y);y+=5;
 if(filt){doc.text("Filtros: "+filt,M,y);y+=5}
 doc.text("Impreso: "+new Date().toLocaleString("es-MX",{dateStyle:"medium",timeStyle:"short"}),M,y);y+=9;
 const hdr=()=>{doc.setFillColor(253,231,239);doc.rect(M,y-4.5,W-2*M,7,"F");doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(34);
  let x=M;cols.forEach(([t,w],i)=>{i===4?doc.text(t,x+w-1,y,{align:"right"}):doc.text(t,x+1,y);x+=w});y+=6;doc.setFont("helvetica","normal")};
 hdr();doc.setFontSize(9);
 if(!L.length){doc.setTextColor(90);doc.text("No hay pagos con estos filtros.",M+1,y+2);y+=8}
 L.forEach(x=>{const cells=[fdate(x.date),x.patient,clinName(payClin(x))||"-",[payDetail(x)||"Pago",x.method,x.paid?"Pagado":"Pendiente"].filter(Boolean).join(" - "),money(x.amount)];
  const lines=cells.map((c,i)=>doc.splitTextToSize(String(c),cols[i][1]-2)),n=Math.max(...lines.map(l=>l.length)),hh=n*4.2+2;
  if(y+hh>280){doc.addPage();y=16;hdr();doc.setFontSize(9)}
  doc.setTextColor(34);let cx=M;lines.forEach((l,i)=>{i===4?doc.text(l,cx+cols[i][1]-1,y,{align:"right"}):doc.text(l,cx+1,y);cx+=cols[i][1]});
  doc.setDrawColor(221);doc.line(M,y+hh-3.2,W-M,y+hh-3.2);y+=hh});
 if(y+34>285){doc.addPage();y=18}
 y+=4;doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(34);
 [["Cobrado",sumA(paid)],["Efectivo",m("Efectivo")],["Tarjeta",m("Tarjeta")],["Transferencia",m("Transferencia")],["Por cobrar",sumA(L.filter(x=>!x.paid))]].forEach(([t,v])=>{doc.text(t,W-M-52,y);doc.text(money(v),W-M,y,{align:"right"});y+=6});
 const np=doc.getNumberOfPages();for(let i=1;i<=np;i++){doc.setPage(i);doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(130);doc.text("Página "+i+" de "+np,W/2,291,{align:"center"})}
 try{doc.save("reporte-pagos-"+hoy+".pdf")}
 catch(e){toast("No se pudo guardar el PDF.")}}

let apEx=[];

function apFill(){$("apExSel").innerHTML='<option value="">Agregar extra…</option>'+S.treats.map(t=>`<option value="${t.id}">${esc(t.name)}${t.price?" · "+money(t.price):""}</option>`).join("")}
function apDraw(){
 $("apExList").innerHTML=apEx.map((e,i)=>`<div class="row" style="padding:8px 10px;margin:6px 0"><div class="pt" style="flex:1;min-width:110px">${esc(e.name)}</div><div class="acts" style="flex-direction:row;align-items:center;flex-wrap:nowrap"><button type="button" class="stp" data-exm="${i}" aria-label="Quitar uno">\u2212</button><span style="min-width:22px;text-align:center">${e.qty}</span><button type="button" class="stp" data-exp="${i}" aria-label="Agregar uno">+</button><input data-exprice="${i}" type="number" min="0" step="0.01" inputmode="decimal" value="${e.price}" aria-label="Precio de ${esc(e.name)}" style="width:84px"><button type="button" class="stp" data-exdel="${i}" aria-label="Quitar extra">\u2715</button></div></div>`).join("");
 const base=+$("apMonto").value||0,ex=apEx.reduce((s,e)=>s+e.price*e.qty,0);
 $("apTotal").textContent=apEx.length?`Total a cobrar: ${money(base+ex)} (cita ${money(base)} + extras ${money(ex)})`:`Total a cobrar: ${money(base)}`}
$("apExSel").onchange=e=>{const t=S.treats.find(x=>x.id===e.target.value);if(!t)return;const ex=apEx.find(x=>x.name===t.name);if(ex)ex.qty++;else apEx.push({name:t.name,price:t.price||0,qty:1});e.target.value="";apDraw()};
$("apExList").onclick=e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.exm!=null)apEx[+d.exm].qty=Math.max(apEx[+d.exm].qty-1,1);else if(d.exp!=null)apEx[+d.exp].qty++;else if(d.exdel!=null)apEx.splice(+d.exdel,1);else return;apDraw()};
$("apExList").onchange=e=>{const i=e.target.dataset.exprice;if(i==null)return;apEx[+i].price=Math.max(+e.target.value||0,0);apDraw()};
$("apMonto").addEventListener("input",apDraw);

/* Cita pagada: solo se puede editar */
function isPaid(a){const P=S.pays.filter(x=>x.aid===a.id&&x.paid),s=P.reduce((t,x)=>t+x.amount,0);return P.length>0&&(!a.price||s>=a.price)}
function autoAttend(aid){const a=S.appts.find(x=>x.id===aid);if(a&&!st(a)&&isPaid(a)){a.status="ok";a.done=false}}

async function makeHC(){
 const p=getP();if(!p)return;
 try{await loadPdf()}catch(e){toast("No se pudo cargar el generador de PDF. Revisa tu conexión.");return}
 const{jsPDF}=window.jspdf,doc=new jsPDF({unit:"mm",format:"letter"}),W=215.9,H=279.4,M=15,R=W-M,rh=7.4;
 const sexo=p.sex==="Femenino"?"F":p.sex==="Masculino"?"M":"",alerg=String((p.alergias!=null?p.alergias:p.notes)||"").trim(),hoy=new Date().toLocaleDateString("es-MX");
 let y=0;
 const t=(s,x,yy,o)=>doc.text(String(s),x,yy,o),sz=n=>doc.setFontSize(n),B=()=>doc.setFont("helvetica","bold"),N=()=>doc.setFont("helvetica","normal"),tw=s=>doc.getTextWidth(String(s));
 const need=n=>{if(y+n>H-16){doc.addPage();y=18}};
 const clip=(s,w)=>{const L=doc.splitTextToSize(String(s||""),w);return L.length>1?L[0].replace(/\s+$/,"")+"...":(L[0]||"")};
 function fld(label,x,w,val){t(label,x,y);const lx=x+tw(label)+1.5;doc.setDrawColor(90);doc.setLineWidth(.2);doc.line(lx,y+.9,x+w,y+.9);if(val)t(clip(val,x+w-lx-2),lx+1,y-.3);return x+w}
 function yn(label,x,v){const s=label+" "+(v==="si"?"(X)":"(si)")+" "+(v==="no"?"(X)":"(no)");t(s,x,y);return x+tw(s)}
